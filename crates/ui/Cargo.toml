[package]
name = "zync-ui"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
# Keep in lockstep with the dioxus-cli (dx) version in Dockerfile and CI.
dioxus = { version = "=0.7.6", features = ["web"] }
futures-util.workspace = true
md5 = "0.7"
serde.workspace = true
serde_json.workspace = true
urlencoding = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "Document", "Element", "HtmlAnchorElement", "HtmlElement", "Location", "Navigator", "Window"] }
