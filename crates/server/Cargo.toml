[package]
name = "zync-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
axum = { version = "0.7", features = ["macros", "ws"] }
axum-extra.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
chrono.workspace = true
futures-util.workspace = true
notify.workspace = true
rand.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower_governor.workspace = true
tracing.workspace = true
# Augments the workspace-level `env-filter` feature with `json`, needed only
# here (P5.3 `ZYNC_LOG_FORMAT=json`) for `tracing_subscriber::fmt::layer().json()`
# in `main.rs`. Cargo unions member-declared features with the workspace
# dependency's own, so this doesn't touch the root `Cargo.toml`.
tracing-subscriber = { workspace = true, features = ["json"] }
uuid.workspace = true
zeroize.workspace = true
zync-git-core = { path = "../git-core" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
