[workspace]
members = [
    "crates/git-core",
    "crates/server",
]
# The UI is the React app in web/ (served by the server from ZYNC_STATIC_DIR).
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.1"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
axum-extra = { version = "0.9", features = ["cookie"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
git2 = "0.18"
notify = "6"
rand = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["compression-gzip", "cors", "fs", "limit", "trace"] }
tower_governor = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

